name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          cd web && npm ci

      - name: Lint
        run: |
          ruff check app tests alembic
          ruff format --check app tests alembic
          mypy app
          cd web && npx tsc --noEmit

      - name: Test
        run: pytest

      - name: Audit dependencies
        run: |
          pip-audit -r requirements.txt --strict
          cd web && npm audit --omit=dev

      - name: Build the browser bundle
        run: cd web && npm run build

      - name: Check the committed bundle is up to date
        run: git diff --exit-code -- app/static/upload.js

  browser:
    runs-on: ubuntu-latest
    continue-on-error: true   # optional: proves .pfx extraction stays in the page
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements-dev.txt playwright
          playwright install --with-deps chromium
      - name: Browser extraction test
        run: pytest -m browser

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t notafter:ci .
      - name: Start it read-only as non-root and check /healthz
        run: |
          docker run -d --name notafter-ci \
            -e AUTH_MODE=cloudflare -e CF_ACCESS_TEAM=example \
            -e CF_ACCESS_AUD=ci-aud -e SECRET_KEY="$(openssl rand -hex 32)" \
            -e BASE_URL=https://certs.example.org \
            -p 127.0.0.1:8087:8000 \
            --read-only --tmpfs /tmp --user 10001:10001 \
            --security-opt no-new-privileges:true --cap-drop ALL \
            notafter:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8087/healthz > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8087/healthz | tee /dev/stderr | grep -q '"status": "ok"'
          docker rm -f notafter-ci
